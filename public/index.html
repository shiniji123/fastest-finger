<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fast Finger</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
  <div class="container">
    <h1>Fast Finger</h1>
    <p class="note">A lightweight real-time buzzer for classroom/camp activities.</p>

    <div class="grid" style="grid-template-columns:1fr 1fr; gap:24px; margin-top:18px;">
      <div class="card" style="text-align:center;">
        <h2>Create</h2>
        <p>Create a room and get a room code (generated automatically).</p>
        <a class="btn btn-primary" href="/create.html">Create Room</a>
      </div>

      <div class="card" style="text-align:center;">
        <h2>Join</h2>
        <p>Join an existing room with a room code.</p>
        <a class="btn btn-primary" href="/join.html">Join Room</a>
      </div>
    </div>

    <div class="note" id="reopenInfo" style="margin-top:18px;"></div>
  </div>

  <script>
    const sid = localStorage.getItem("mod.sid");
    const roomName = localStorage.getItem("mod.roomName");
    if (sid && roomName) {
      const el = document.getElementById("reopenInfo");
      el.innerHTML = `Last host room: <strong>${roomName}</strong> (Code ${sid}) — <a href="/moderator.html?sid=${sid}">Reopen</a>`;
    }
  </script>
</body>
</html>
