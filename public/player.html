<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buzzer • Fast Finger</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
  <div class="container">
    <h2 id="welcome">Welcome</h2>
    <div class="big-wrap">
      <button id="big" class="big-btn red">WAIT</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const sid = params.get("sid") || localStorage.getItem("player.sid");
    const name = params.get("name") || localStorage.getItem("player.name");
    if (!sid || !name) location.href="/join.html";
    localStorage.setItem("player.sid", sid);
    localStorage.setItem("player.name", name);

    document.getElementById("welcome").textContent = `Welcome, ${name}!`;

    let active = false;
    let locked = false;

    function setWait(){ const btn = document.getElementById("big"); btn.className="big-btn red"; btn.textContent="WAIT"; locked=false; }
    function setActive(){ const btn = document.getElementById("big"); btn.className="big-btn green"; btn.textContent="BUZZ!"; }
    function setFoul(){ const btn = document.getElementById("big"); btn.className="big-btn gray"; btn.textContent="FOUL"; locked=true; }
    function setBuzzed(){
  const btn = document.getElementById("big");
  btn.className = "big-btn blue";
  btn.textContent = "DONE";
  locked = true;
}


    const socket = io();
    socket.emit("join_session", { sid, role: "player", name });

    socket.on("state", (st)=>{ active = !!st.active; if (active) setActive(); else setWait(); });
    socket.on("game_state", ({active:a})=>{ active=a; if (active) setActive(); else setWait(); });
    socket.on("reset", ()=> setWait());
    socket.on("you_fouled", ()=> setFoul());

    document.getElementById("big").addEventListener("click", ()=>{
      if (locked) return;
      if (!active) { setFoul(); socket.emit("buzz", { sid, name }); }
      else { setBuzzed(); socket.emit("buzz", { sid, name }); }
    });
  </script>
</body>
</html>
